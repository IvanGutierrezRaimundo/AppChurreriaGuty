<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Pedidos</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" />
  <style>
    /* Ajustes mínimos específicos del panel admin para usar el tema corporativo */
    .admin-bar{ max-width: 1200px; margin: 0 auto var(--space-lg); display:flex; align-items:center; justify-content: space-between; }
    .menu-toggle-btn{
      display: none;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 1px solid var(--color-border);
      background: var(--color-primary);
      color: var(--color-brown);
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
    }
    @media (max-width: 680px){
      .admin-bar{ flex-wrap: wrap; position: relative; }
      .menu-toggle-btn{ display: inline-flex; }
      .admin-bar .actions{
        display: none;
        flex-direction: column;
        gap: 8px;
        width: 100%;
        margin-top: 10px;
      }
      .admin-bar .actions.is-open{ display: flex; }
    }
    .admin-grid{ display:grid; grid-template-columns: 2.5fr 1fr 1fr 1fr auto; gap: 12px; align-items:end; }
    #filtrosToggleBtn{ display: none; }
    .filtros-panel-head{ display: none; }
    .filtros-close-btn{ display: none; }
    @media (max-width: 680px){
      #filtrosToggleBtn{ display: inline-flex; }
      .filtros-backdrop{
        position: fixed;
        inset: 0;
        background: rgba(43, 30, 24, 0.42);
        display: none;
        align-items: flex-start;
        justify-content: center;
        padding: 16px;
        overflow-y: auto;
        z-index: 1000;
      }
      .filtros-backdrop.is-open{ display: flex; }
      .filtros-panel{
        background: #FFF;
        border-radius: var(--radius);
        box-shadow: var(--shadow-md);
        padding: 20px;
        width: 100%;
        max-width: 420px;
      }
      .filtros-panel-head{
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .filtros-panel-head h2{ margin: 0; color: var(--color-brown); font-size: 1.15rem; }
      .filtros-close-btn{
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        border: 1px solid var(--color-border);
        background: #FFF;
        color: var(--color-brown);
        font-size: 1.2rem;
        line-height: 1;
        cursor: pointer;
      }
      .filtros-backdrop .admin-grid{
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }
    }
    .admin-table-wrap{ max-width: 1200px; margin: 0 auto; }
    .admin-doc{ max-width: 1200px; margin: 0 auto; }
    #pedidosTable th{
      font-size: 0.72rem;
      line-height: 1.15;
      padding: 8px 6px;
      white-space: nowrap;
    }
    th.sortable{ cursor: pointer; user-select: none; white-space: nowrap; }
    #pedidosTable td:nth-child(1),
    #pedidosTable td:nth-child(n+3):nth-child(-n+5){ text-align: center; }
    th .sort-icons{ margin-left: 3px; font-size: 0.68rem; color: var(--color-muted); display:inline-flex; gap:1px; }
    th[data-dir="asc"] .arrow-up{ color: var(--color-brown); }
    th[data-dir="desc"] .arrow-down{ color: var(--color-brown); }
    /* (Revert) Usar estilos corporativos por defecto para tablas y acciones */
    .btn-row{ display:inline-flex; align-items:center; gap:8px; white-space: nowrap; }
    .view-switch{ display: flex; justify-content: flex-start; gap: 8px; margin: 0 0 10px; }
    .view-toggle{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 96px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      background: var(--color-primary);
      color: var(--color-brown);
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease;
    }
    .view-toggle:hover{ border-color: var(--color-brown); }
    .view-toggle.is-active{
      background: #E5E7EB;
      border-color: #D1D5DB;
      color: #374151;
    }
    .load-more-btn{
      display: block;
      margin: 14px auto 0;
      min-width: 160px;
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      background: var(--color-primary);
      color: var(--color-brown);
      font-weight: 800;
      cursor: pointer;
    }
    .load-more-btn:hover{ border-color: var(--color-brown); }
    .load-more-btn:disabled{ opacity: 0.6; cursor: default; }
    .cards-grid{
      display: none;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 12px;
      margin-top: 8px;
    }
    .cards-grid.is-visible{ display: grid; }
    .calendar-view{
      display: none;
      margin-top: 8px;
      background: #FFF;
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 10px;
      box-shadow: var(--shadow-sm);
    }
    .calendar-view.is-visible{ display: block; }
    .calendar-empty{
      color: var(--color-muted);
      text-align: center;
      padding: 28px 10px;
      font-weight: 600;
      display: none;
    }
    .calendar-empty.is-visible{ display: block; }
    .fc .fc-button-primary{
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: var(--color-brown);
      font-weight: 700;
    }
    .fc .fc-button-primary:not(:disabled):hover{
      background: #F5C600;
      border-color: #F5C600;
      color: var(--color-brown);
    }
    .fc .fc-button-primary:disabled{
      background: #E5E7EB;
      border-color: #E5E7EB;
      color: #6B7280;
    }
    .fc .fc-toolbar-title{ color: var(--color-brown); font-size: 1.1rem; }
    .fc .fc-daygrid-event{ border-radius: 8px; padding: 2px 4px; }
    .fc .fc-daygrid-day-frame{ min-height: 170px; }
    .fc .fc-daygrid-day-events{
      max-height: 150px;
      overflow-y: auto;
      padding-right: 2px;
    }
    .cal-event-main{
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      width: 100%;
    }
    .cal-event-cliente{
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      flex: 1;
    }
    .cal-event-hora{
      font-weight: 800;
      flex-shrink: 0;
    }
    .pedido-card{
      border: 1px solid var(--color-border);
      border-radius: 12px;
      background: #FFF;
      padding: 12px;
      box-shadow: var(--shadow-sm);
    }
    .pedido-card-head{
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .pedido-card-id{ font-weight: 800; color: var(--color-brown); }
    .pedido-card-grid{
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }
    .pedido-card-row{
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: baseline;
    }
    .pedido-card-label{ color: var(--color-muted); font-size: 0.9rem; }
    .pedido-card-value{ font-weight: 700; text-align: right; }
    @media (max-width: 560px){
      .cards-grid{ grid-template-columns: 1fr; }
    }
    @media (max-width: 680px){
      #viewTablaBtn{ display: none; }
      #pedidosTable{ display: none !important; }
      .fc .fc-toolbar{
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .fc .fc-toolbar-chunk{
        display: flex;
        justify-content: center;
      }
      .fc .fc-toolbar-chunk:nth-child(2){
        order: -1;
      }
    }
    .estado-cell{ cursor: pointer; }
    .estado-cell .pedido-estado-badge{ pointer-events: none; }
    .estado-modal-backdrop{
      position: fixed;
      inset: 0;
      background: rgba(43, 30, 24, 0.42);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }
    .estado-modal-backdrop.is-open{ display: flex; }
    .estado-modal{
      width: min(100%, 420px);
      background: #FFF;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      padding: 20px;
    }
    .estado-modal h2{ margin: 0 0 8px; color: var(--color-brown); font-size: 1.25rem; }
    .estado-modal p{ margin: 0 0 16px; color: var(--color-muted); }
    .estado-modal-actions{ display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
    .estado-modal-error{ min-height: 1.5em; margin-top: 10px; color: #B91C1C; font-weight: 600; }
    .infinite-status{
      max-width: 1200px;
      margin: 10px auto 0;
      color: var(--color-muted);
      font-weight: 600;
      text-align: center;
      display: none;
    }
    .infinite-status.is-visible{ display: block; }
  </style>
</head>
<body>
  <div class="admin-bar">
    <h1>Pedidos</h1>
    <button type="button" id="menuToggleBtn" class="menu-toggle-btn" aria-label="Abrir menú" aria-expanded="false" aria-controls="actionsMenu">☰</button>
    <div class="actions" id="actionsMenu">
      <button type="button" id="menuBtn" title="Menu">Menu</button>
      <button type="button" id="historialBtn" title="Historial">Historial</button>
      <button type="button" id="createPedidoBtn" title="Crear Pedido">Crear Pedido</button>
      <button type="button" id="exportBtn" title="Exportar CSV">Exportar</button>
      <button type="button" id="printPdfBtn" title="Imprimir PDF">Imprimir PDF</button>
    </div>
  </div>

  <div class="doc admin-doc">
  <div id="filtrosBackdrop" class="filtros-backdrop">
    <div class="filtros-panel">
      <div class="filtros-panel-head">
        <h2>Filtros</h2>
        <button type="button" id="filtrosCloseBtn" class="filtros-close-btn" aria-label="Cerrar">&times;</button>
      </div>
      <section class="admin-grid">
        <div class="field">
          <label for="q">Buscar</label>
          <input id="q" placeholder="nombre, email, teléfono, ciudad, provincia" />
        </div>
        <div class="field">
          <label for="desde">Desde</label>
          <input id="desde" type="date" />
        </div>
        <div class="field">
          <label for="hasta">Hasta</label>
          <input id="hasta" type="date" />
        </div>
        <div class="field">
          <label for="pageSize">Resultados</label>
          <select id="pageSize">
            <option>20</option>
            <option selected>50</option>
            <option>100</option>
            <option value="all">Todos</option>
          </select>
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button id="searchBtn">Buscar</button>
        </div>
      </section>
    </div>
  </div>
  <div class="admin-table-wrap">
  <div class="view-switch" aria-label="Cambiar vista de pedidos">
    <button type="button" id="viewTablaBtn" class="view-toggle is-active" aria-current="page">Tabla</button>
    <button type="button" id="viewFichasBtn" class="view-toggle">Fichas</button>
    <button type="button" id="viewCalendarioBtn" class="view-toggle">Calendario</button>
    <button type="button" id="filtrosToggleBtn" class="view-toggle">Filtros</button>
  </div>
  <table id="pedidosTable">
    <thead>
      <tr>
        <th class="sortable" data-sort="id">Nº <span class="sort-icons"><span class="arrow-up">▲</span><span class="arrow-down">▼</span></span></th>
        <th class="sortable" data-sort="nombre">Cliente <span class="sort-icons"><span class="arrow-up">▲</span><span class="arrow-down">▼</span></span></th>
        <th class="sortable" data-sort="personas">Personas <span class="sort-icons"><span class="arrow-up">▲</span><span class="arrow-down">▼</span></span></th>
        <th class="sortable" data-sort="churros_por_persona">Churros por persona <span class="sort-icons"><span class="arrow-up">▲</span><span class="arrow-down">▼</span></span></th>
        <th class="sortable" data-sort="chocolates">Chocolates <span class="sort-icons"><span class="arrow-up">▲</span><span class="arrow-down">▼</span></span></th>
        <th class="sortable" data-sort="fecha">Fecha <span class="sort-icons"><span class="arrow-up">▲</span><span class="arrow-down">▼</span></span></th>
        <th class="sortable" data-sort="hora">Hora <span class="sort-icons"><span class="arrow-up">▲</span><span class="arrow-down">▼</span></span></th>
        <th class="sortable" data-sort="presupuesto_total">Total (€) <span class="sort-icons"><span class="arrow-up">▲</span><span class="arrow-down">▼</span></span></th>
        <th class="sortable" data-sort="estado">Estado <span class="sort-icons"><span class="arrow-up">▲</span><span class="arrow-down">▼</span></span></th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="cardsGrid" class="cards-grid"></div>
  <div id="calendarView" class="calendar-view"></div>
  <div id="calendarEmpty" class="calendar-empty"></div>
  <button type="button" id="loadMoreBtn" class="load-more-btn" style="display:none;">Cargar más</button>
  <p id="infiniteStatus" class="infinite-status" aria-live="polite"></p>
  </div>
  </div>

  <div id="estadoModalBackdrop" class="estado-modal-backdrop" aria-hidden="true">
    <div class="estado-modal" role="dialog" aria-modal="true" aria-labelledby="estadoModalTitle">
      <h2 id="estadoModalTitle">Cambiar estado</h2>
      <p id="estadoModalText"></p>
      <div class="field">
        <label for="estadoModalSelect">Nuevo estado</label>
        <select id="estadoModalSelect">
          <option value="Pendiente">Pendiente</option>
          <option value="Realizado">Realizado</option>
          <option value="Cobrado">Cobrado/Fin</option>
          <option value="Cancelado">Cancelado</option>
        </select>
      </div>
      <div id="estadoModalError" class="estado-modal-error"></div>
      <div class="estado-modal-actions">
        <button type="button" id="estadoModalCancel">Cancelar</button>
        <button type="button" id="estadoModalSave">Guardar</button>
      </div>
    </div>
  </div>

  <div id="actionConfirmModal" class="confirm-modal-backdrop hidden" aria-hidden="true">
    <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="actionConfirmTitle">
      <div class="confirm-header">
        <h2 id="actionConfirmTitle" class="confirm-title">Confirmación</h2>
      </div>
      <p id="actionConfirmText" class="confirm-status"></p>
      <div class="confirm-actions">
        <button type="button" id="actionConfirmCancel" class="ghost">Cancelar</button>
        <button type="button" id="actionConfirmAccept">Aceptar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.3/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="/admin/assets/factura-pedido.js"></script>
  <script>
    const tbody = document.getElementById('tbody');
    const pageSizeSel = document.getElementById('pageSize');
    const pedidosTable = document.getElementById('pedidosTable');
    const cardsGrid = document.getElementById('cardsGrid');
    const calendarView = document.getElementById('calendarView');
    const calendarEmpty = document.getElementById('calendarEmpty');
    const viewTablaBtn = document.getElementById('viewTablaBtn');
    const viewFichasBtn = document.getElementById('viewFichasBtn');
    const viewCalendarioBtn = document.getElementById('viewCalendarioBtn');
    const estadoModalBackdrop = document.getElementById('estadoModalBackdrop');
    const estadoModalText = document.getElementById('estadoModalText');
    const estadoModalSelect = document.getElementById('estadoModalSelect');
    const estadoModalError = document.getElementById('estadoModalError');
    const estadoModalCancel = document.getElementById('estadoModalCancel');
    const estadoModalSave = document.getElementById('estadoModalSave');
    const actionConfirmModal = document.getElementById('actionConfirmModal');
    const actionConfirmTitle = document.getElementById('actionConfirmTitle');
    const actionConfirmText = document.getElementById('actionConfirmText');
    const actionConfirmCancel = document.getElementById('actionConfirmCancel');
    const actionConfirmAccept = document.getElementById('actionConfirmAccept');
    const infiniteStatus = document.getElementById('infiniteStatus');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    let editingEstadoId = null;
    let actionConfirmResolver = null;
    let actionConfirmMode = 'confirm';
    const isMobileView = () => window.matchMedia('(max-width: 680px)').matches;
    let currentView = isMobileView() ? 'fichas' : 'tabla';
    let calendar = null;
    let currentRows = [];
    let infiniteMode = false;
    let infinitePage = 1;
    let infiniteHasMore = true;
    let infiniteLoading = false;
    const INFINITE_BATCH_SIZE = 100;
    let pedidosNextPage = 1;
    let pedidosHasMore = true;
    let pedidosLeftover = [];
    function formatDate(value){
      if(!value) return '';
      try{
        if(typeof value === 'string'){
          let s = value;
          if(s.includes('T')) s = s.slice(0,10); // recorta YYYY-MM-DD de ISO
          if(/^\d{4}-\d{2}-\d{2}$/.test(s)){
            const [y,m,d] = s.split('-');
            return `${d}/${m}/${y}`;
          }
          const dt = new Date(value);
          if(!isNaN(dt)) return dt.toLocaleDateString('es-ES');
        } else {
          const dt = new Date(value);
          if(!isNaN(dt)) return dt.toLocaleDateString('es-ES');
        }
      } catch(_){ /* noop */ }
      return String(value);
    }
    function formatTime(value){
      if(!value) return '';
      try{
        if(typeof value === 'string'){
          const m = /^(\d{2}):(\d{2})(?::\d{2})?$/.exec(value);
          if(m) return `${m[1]}:${m[2]}`;
        } else {
          const dt = new Date(value);
          if(!isNaN(dt)){
            const hh = String(dt.getHours()).padStart(2,'0');
            const mm = String(dt.getMinutes()).padStart(2,'0');
            return `${hh}:${mm}`;
          }
        }
      } catch(_){ /* noop */ }
      return String(value);
    }
    function getEstadoBadgeClass(estadoRaw){
      const estado = estadoRaw || 'Pendiente';
      switch(estado){
        case 'Realizado':
          return 'pedido-estado-realizado';
        case 'Cobrado':
          return 'pedido-estado-cobrado';
        case 'Cancelado':
          return 'pedido-estado-cancelado';
        case 'Pendiente':
        default:
          return 'pedido-estado-pendiente';
      }
    }
    function getEstadoBadgeText(estadoRaw){
      const estado = estadoRaw || 'Pendiente';
      return estado === 'Cobrado' ? 'Cobrado/Fin' : estado;
    }
    function renderEstadoBadge(estadoRaw){
      const estado = estadoRaw || 'Pendiente';
      return `<span class="pedido-estado-badge ${getEstadoBadgeClass(estado)}">${getEstadoBadgeText(estado)}</span>`;
    }
    function updateViewButtons(){
      const isTabla = currentView === 'tabla';
      const isFichas = currentView === 'fichas';
      const isCalendario = currentView === 'calendario';
      viewTablaBtn.classList.toggle('is-active', isTabla);
      viewFichasBtn.classList.toggle('is-active', isFichas);
      viewCalendarioBtn.classList.toggle('is-active', isCalendario);
      if(isTabla) viewTablaBtn.setAttribute('aria-current', 'page');
      else viewTablaBtn.removeAttribute('aria-current');
      if(isFichas) viewFichasBtn.setAttribute('aria-current', 'page');
      else viewFichasBtn.removeAttribute('aria-current');
      if(isCalendario) viewCalendarioBtn.setAttribute('aria-current', 'page');
      else viewCalendarioBtn.removeAttribute('aria-current');
    }
    function getEstadoCalendarColors(estadoRaw){
      const estado = estadoRaw || 'Pendiente';
      switch(estado){
        case 'Realizado':
          return { backgroundColor: '#DCFCE7', borderColor: '#16A34A', textColor: '#166534' };
        case 'Cobrado':
          return { backgroundColor: '#DBEAFE', borderColor: '#2563EB', textColor: '#1D4ED8' };
        case 'Cancelado':
          return { backgroundColor: '#FEE2E2', borderColor: '#DC2626', textColor: '#B91C1C' };
        case 'Pendiente':
        default:
          return { backgroundColor: 'var(--color-primary)', borderColor: 'var(--color-primary)', textColor: 'var(--color-brown)' };
      }
    }
    function buildCalendarEvents(rows){
      return rows
        .filter((r) => r && r.fecha)
        .map((r) => {
          const fecha = String(r.fecha).includes('T') ? String(r.fecha).slice(0, 10) : String(r.fecha).slice(0, 10);
          const horaMatch = /^(\d{2}):(\d{2})/.exec(String(r.hora || ''));
          const start = horaMatch ? `${fecha}T${horaMatch[1]}:${horaMatch[2]}:00` : fecha;
          const allDay = !horaMatch;
          const colors = getEstadoCalendarColors(r.estado);
          return {
            id: String(r.id),
            title: `${r.nombre || 'Cliente'}`,
            start,
            allDay,
            backgroundColor: colors.backgroundColor,
            borderColor: colors.borderColor,
            textColor: colors.textColor,
            extendedProps: {
              pedidoId: r.id,
              estado: r.estado || 'Pendiente',
              nombre: r.nombre || '',
              hora: horaMatch ? `${horaMatch[1]}:${horaMatch[2]}` : '',
              total: r.presupuesto_total
            }
          };
        });
    }
    function ensureCalendar(){
      if(calendar || !window.FullCalendar) return;
      calendar = new FullCalendar.Calendar(calendarView, {
        initialView: 'dayGridMonth',
        locale: 'es',
        firstDay: 1,
        height: 'auto',
        dayMaxEventRows: false,
        dayMaxEvents: false,
        displayEventTime: false,
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        buttonText: {
          today: 'Hoy',
          month: 'Mes',
          week: 'Semana',
          day: 'Dia'
        },
        eventClick: (info) => {
          const id = info.event.extendedProps.pedidoId;
          if(id) location.href = `/admin/pedido/${id}`;
        },
        eventContent: (arg) => {
          const ex = arg.event.extendedProps;
          const wrap = document.createElement('div');
          wrap.className = 'cal-event-main';

          const cliente = document.createElement('span');
          cliente.className = 'cal-event-cliente';
          cliente.textContent = ex.nombre || arg.event.title || 'Cliente';

          wrap.appendChild(cliente);

          if(ex.hora){

            hora.className = 'cal-event-hora';

            wrap.appendChild(hora);
          }

          return { domNodes: [wrap] };

          const hora = ex.hora ? ` ${ex.hora}` : '';
          info.el.title = `${ex.nombre || 'Cliente'}${hora}`;

    function closeActionConfirmModal(accepted){
      actionConfirmModal.classList.add('hidden');
      actionConfirmModal.setAttribute('aria-hidden', 'true');
      if(actionConfirmResolver){
        const resolve = actionConfirmResolver;
        actionConfirmResolver = null;
        resolve(actionConfirmMode === 'alert' ? true : accepted);
      }
      actionConfirmCancel.classList.remove('hidden');
      actionConfirmMode = 'confirm';
      actionConfirmText.classList.remove('error');

    function askActionConfirm({ title, message, acceptText }){

      setActionMessageType('info');

      actionConfirmCancel.classList.remove('hidden');
      actionConfirmModal.classList.remove('hidden');
      actionConfirmModal.setAttribute('aria-hidden', 'false');

      });

    function showActionAlert({ title, message, acceptText, type }){
      actionConfirmMode = 'alert';

      actionConfirmTitle.textContent = title || (resolvedType === 'error' ? 'Error' : 'Aviso');
      actionConfirmText.textContent = message || '';
      setActionMessageType(resolvedType);
      actionConfirmAccept.textContent = acceptText || 'Aceptar';
      actionConfirmCancel.classList.add('hidden');
      actionConfirmModal.classList.remove('hidden');
      actionConfirmModal.setAttribute('aria-hidden', 'false');

    async function saveEstadoFromModal(){
      const id = Number(editingEstadoId);
      if(!Number.isFinite(id)) return;
      const estado = estadoModalSelect.value;
      estadoModalSave.disabled = true;
      estadoModalCancel.disabled = true;
      estadoModalError.textContent = '';
      try {
        const resp = await fetch(`/admin/api/pedidos/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ estado })
        });
        if (resp.status === 401) {
          location.href = '/admin';
          return;
        }
        const data = await resp.json();
        if (!data || !data.ok) {
          estadoModalError.textContent = data?.error || 'No se pudo guardar el estado.';
          return;
        }
        const finalEstado = data.data?.estado || estado;
        document.querySelectorAll(`.estado-cell[data-id="${id}"]`).forEach((cell) => {
          cell.dataset.estado = finalEstado;
          cell.innerHTML = renderEstadoBadge(finalEstado);
        });
        currentRows = currentRows.map((r) => (Number(r.id) === id ? { ...r, estado: finalEstado } : r));
        if(finalEstado === 'Cobrado' || finalEstado === 'Cancelado'){
          currentRows = currentRows.filter(isPedidoActivo);
          renderPedidosRows(currentRows);
        }
        if(currentView === 'calendario') renderCalendar(currentRows);
        closeEstadoModal();
        if(finalEstado === 'Cobrado' || finalEstado === 'Cancelado'){
          await showActionAlert({ title: 'Aviso', message: 'Pedido enviado al historial' });
        }
      } catch (_error) {
        estadoModalError.textContent = 'Error guardando estado.';
      } finally {
        if (estadoModalBackdrop.classList.contains('is-open')) {
          estadoModalSave.disabled = false;
          estadoModalCancel.disabled = false;
        }
      }
    }
    let currentSort = 'estado';
    let currentDir = 'asc';

    function sortPedidosRows(rows){
      const dirFactor = currentDir === 'asc' ? 1 : -1;
      function toNumber(v){ const n = Number(v); return Number.isFinite(n) ? n : 0; }
      function toDate(v){
        if(!v) return 0;
        if(typeof v === 'string'){
          let s = v; if(s.includes('T')) s = s.slice(0,10);
          if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return new Date(s).getTime();
        }
        const d = new Date(v); return isNaN(d) ? 0 : d.getTime();
      }
      function toMinutes(v){
        if(typeof v === 'string'){
          const m = /^(\d{2}):(\d{2})(?::\d{2})?$/.exec(v);
          if(m){ return Number(m[1])*60 + Number(m[2]); }
        }
        return 0;
      }
      function compareByFechaHoraId(a, b){
        const byFecha = toDate(a.fecha) - toDate(b.fecha);
        if(byFecha !== 0) return byFecha;
        const byHora = toMinutes(a.hora) - toMinutes(b.hora);
        if(byHora !== 0) return byHora;
        return toNumber(a.id) - toNumber(b.id);
      }
      rows.sort((a,b) => {
        let cmp = 0;
        switch(currentSort){
          case 'id': cmp = (toNumber(a.anio) - toNumber(b.anio)) || (toNumber(a.numero) - toNumber(b.numero)) || (toNumber(a.id) - toNumber(b.id)); break;
          case 'presupuesto_total': cmp = toNumber(a.presupuesto_total) - toNumber(b.presupuesto_total); break;
          case 'fecha': cmp = toDate(a.fecha) - toDate(b.fecha); break;
          case 'hora': cmp = toMinutes(a.hora) - toMinutes(b.hora); break;
          case 'estado': {
            const ESTADO_ORDER = { 'Pendiente': 0, 'Realizado': 1, 'Cobrado': 2, 'Cancelado': 3 };
            const av = ESTADO_ORDER[a.estado] ?? 0;
            const bv = ESTADO_ORDER[b.estado] ?? 0;
            cmp = av - bv;
            if(cmp === 0) cmp = compareByFechaHoraId(a, b);
            break;
          }
          case 'personas': cmp = toNumber(a.personas) - toNumber(b.personas); break;
          case 'churros_por_persona': cmp = toNumber(a.churros_por_persona) - toNumber(b.churros_por_persona); break;
          case 'chocolates': cmp = toNumber(a.chocolates) - toNumber(b.chocolates); break;
          case 'nombre':
          default: {
            const av = (a.nombre||'').toString().toLowerCase();
            const bv = (b.nombre||'').toString().toLowerCase();
            cmp = av.localeCompare(bv, 'es');
            break;
          }
        }
        return dirFactor * cmp;
      });
    }

    function renderPedidosRows(rows){
      tbody.innerHTML = '';
      cardsGrid.innerHTML = '';
      for (const r of rows) {
        const tr = document.createElement('tr');
        tr.innerHTML = `

          <td>${r.chocolates ?? ''}</td>
          <td>${formatDate(r.fecha)}</td>
          <td>${formatTime(r.hora)}</td>
          <td>${r.presupuesto_total}</td>
          <td class="estado-cell" data-id="${r.id}" data-estado="${r.estado || 'Pendiente'}" data-nombre="${(r.nombre || '').replace(/"/g, '&quot;')}" title="Cambiar estado">${renderEstadoBadge(r.estado)}</td>

    // Los pedidos Cobrado y Cancelado van al historial y no se muestran aquí.
    function isPedidoActivo(r){
      const estado = r?.estado || 'Pendiente';
      return estado !== 'Cobrado' && estado !== 'Cancelado';
    }

    function getPedidosBaseParams(pageSize){
      const q = document.getElementById('q').value.trim();
      const desde = document.getElementById('desde').value;
      const hasta = document.getElementById('hasta').value;
      const params = new URLSearchParams({ pageSize: String(pageSize), sort: currentSort, dir: currentDir });
      if (q) params.set('q', q);
      if (desde) params.set('desde', desde);
      if (hasta) params.set('hasta', hasta);
      return params;
    }

    function setInfiniteStatus(text, visible){
      if(!infiniteStatus) return;
      infiniteStatus.textContent = text || '';
      infiniteStatus.classList.toggle('is-visible', !!visible);
    }

    async function loadPedidosInfiniteNext(){
      if(!infiniteMode || infiniteLoading || !infiniteHasMore) return;
      infiniteLoading = true;
      setInfiniteStatus('Cargando más resultados...', true);
      try {
        const params = getPedidosBaseParams(INFINITE_BATCH_SIZE);
        params.set('page', String(infinitePage));
        const res = await fetch(`/admin/api/pedidos?${params.toString()}`);
        const data = await res.json();
        if (!data.ok) {
          await showActionAlert({ title: 'Error', message: data.error || 'Error' });
          infiniteHasMore = false;
          return;
        }
        const chunk = Array.isArray(data.data) ? data.data : [];
        const visible = chunk.filter(isPedidoActivo);
        currentRows = currentRows.concat(visible);
        sortPedidosRows(currentRows);
        renderPedidosRows(currentRows);
        if (chunk.length < INFINITE_BATCH_SIZE) infiniteHasMore = false;
        infinitePage += 1;
        if(!infiniteHasMore) setInfiniteStatus('Fin de resultados', true);
        else setInfiniteStatus('Desplázate para cargar más', true);
      } finally {
        infiniteLoading = false;
      }
    }

    async function startPedidosInfiniteLoad(){
      infiniteMode = true;
      infinitePage = 1;
      infiniteHasMore = true;
      currentRows = [];
      renderPedidosRows(currentRows);
      setInfiniteStatus('Cargando más resultados...', true);
      await loadPedidosInfiniteNext();
      if(currentRows.length === 0 && !infiniteHasMore){
        setInfiniteStatus('No hay resultados', true);
      }
    }

    function updateSortIndicators(){
      document.querySelectorAll('th.sortable').forEach(th => {
        if(th.getAttribute('data-sort') === currentSort){ th.setAttribute('data-dir', currentDir); }
        else { th.removeAttribute('data-dir'); }
      });
    }
    function downloadPedidosPdf(){
      if(!window.jspdf || !window.jspdf.jsPDF || typeof window.jspdf.jsPDF !== 'function'){
        showActionAlert({ title: 'Error', message: 'No se pudo cargar la libreria PDF. Intentalo de nuevo.' });
        return;
      }
      if(!Array.isArray(currentRows) || currentRows.length === 0){
        showActionAlert({ title: 'Aviso', message: 'No hay pedidos para exportar en PDF.' });
        return;
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
      const now = new Date();
      const stamp = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;

      doc.setFontSize(16);
      doc.text('Tabla de Pedidos', 40, 40);
      doc.setFontSize(10);
      doc.text(`Generado: ${now.toLocaleString('es-ES')}`, 40, 58);

      const headers = [[
        'Nº fact.', 'Cliente', 'Personas', 'Churros/persona', 'Chocolates', 'Fecha', 'Hora', 'Total (EUR)', 'Estado'
      ]];
      const body = currentRows.map((r) => [
        r.num_factura ?? r.id ?? '',
        r.nombre ?? '',
        r.personas ?? '',
        r.churros_por_persona ?? '',
        r.chocolates ?? '',
        formatDate(r.fecha),
        formatTime(r.hora),
        (typeof r.presupuesto_total !== 'undefined' && r.presupuesto_total !== null) ? Number(r.presupuesto_total).toFixed(2) : '',
        (r.estado === 'Cobrado' ? 'Cobrado/Fin' : (r.estado || 'Pendiente'))
      ]);

      doc.autoTable({
        head: headers,
        body,
        startY: 72,
        styles: { fontSize: 9, cellPadding: 4 },
        headStyles: { fillColor: [255, 210, 0], textColor: [91, 58, 46] },
        alternateRowStyles: { fillColor: [248, 248, 248] },
        theme: 'striped'
      });

      doc.save(`pedidos_${stamp}.pdf`);
    }
    // Obtiene 'targetCount' filas visibles (excluye Cobrado), continuando desde
    // pedidosNextPage y guardando el sobrante en pedidosLeftover para la siguiente carga.
    async function fetchPedidosVisibleBatch(pageSize, targetCount){
      const rows = [];
      while (pedidosLeftover.length && rows.length < targetCount) {
        rows.push(pedidosLeftover.shift());
      }
      while (rows.length < targetCount && pedidosHasMore) {
        const params = new URLSearchParams(getPedidosBaseParams(pageSize));
        params.set('page', String(pedidosNextPage));
        const res = await fetch(`/admin/api/pedidos?${params.toString()}`);
        const data = await res.json();
        if (!data.ok) {
          await showActionAlert({ title: 'Error', message: data.error || 'Error' });
          return null;
        }
        const chunk = Array.isArray(data.data) ? data.data : [];
        rows.push(...chunk.filter(isPedidoActivo));
        if (chunk.length < pageSize) {
          pedidosHasMore = false;
        } else {
          pedidosNextPage += 1;
        }
      }
      if (rows.length > targetCount) {
        pedidosLeftover = rows.splice(targetCount);
      }
      return rows;
    }

    async function load() {
      if (pageSizeSel.value === 'all') {
        await startPedidosInfiniteLoad();
        updateLoadMoreButton();
        return;
      }
      infiniteMode = false;
      setInfiniteStatus('', false);
      const pageSize = Number(pageSizeSel.value);
      pedidosNextPage = 1;
      pedidosHasMore = true;
      pedidosLeftover = [];

      const rows = await fetchPedidosVisibleBatch(pageSize, pageSize);
      if (rows === null) return;

      sortPedidosRows(rows);
      currentRows = rows;
      renderPedidosRows(currentRows);
      updateLoadMoreButton();
    }

    async function loadMorePedidos(){
      if (loadMoreBtn.disabled) return;
      const pageSize = Number(pageSizeSel.value) || 50;
      loadMoreBtn.disabled = true;
      loadMoreBtn.textContent = 'Cargando...';
      try {
        const more = await fetchPedidosVisibleBatch(pageSize, pageSize);
        if (more === null) return;
        currentRows = currentRows.concat(more);
        sortPedidosRows(currentRows);
        renderPedidosRows(currentRows);
      } finally {
        loadMoreBtn.disabled = false;
        loadMoreBtn.textContent = 'Cargar más';
        updateLoadMoreButton();
      }
