<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Clientes</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .admin-bar{ max-width: 1200px; margin: 0 auto var(--space-lg); display:flex; align-items:center; justify-content: space-between; }
    .admin-grid{ display:grid; grid-template-columns: 2.5fr 1fr auto; gap: 12px; align-items:end; }
    .admin-table-wrap{ max-width: 1200px; margin: 0 auto; }
    .admin-doc{ max-width: 1200px; margin: 0 auto; }
    th.sortable{ cursor: pointer; user-select: none; }
    th .sort-icons{ margin-left: 6px; font-size: 0.82rem; color: var(--color-muted); display:inline-flex; gap:2px; }
    th[data-dir="asc"] .arrow-up{ color: var(--color-brown); }
    th[data-dir="desc"] .arrow-down{ color: var(--color-brown); }
    .btn-row{ display:inline-flex; align-items:center; gap:8px; white-space: nowrap; }
    .cliente-modal-backdrop{
      position: fixed;
      inset: 0;
      background: rgba(43, 30, 24, 0.42);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }
    .cliente-modal-backdrop.is-open{ display: flex; }
    .cliente-modal{
      width: min(100%, 640px);
      background: #FFF;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      padding: 14px;
      max-height: calc(100vh - 34px);
      overflow: auto;
    }
    .cliente-modal-head{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .cliente-modal-head h2{ margin: 0; color: var(--color-brown); font-size: 1.08rem; }
    .cliente-modal-grid{
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 10px;
    }
    .cliente-detail{
      border: 1px solid var(--color-border);
      border-radius: 8px;
      background: #FFF;
      padding: 8px;
      min-height: 48px;
    }
    .cliente-detail-label{ margin: 0 0 3px; color: var(--color-muted); font-size: 0.78rem; }
    .cliente-detail-value{ margin: 0; color: var(--color-brown); font-size: 0.93rem; font-weight: 700; word-break: break-word; }
    .cliente-modal-actions{ display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .cliente-edit-input{
      width: 100%;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 6px 8px;
      font: inherit;
      font-size: 0.92rem;
      color: var(--color-brown);
      background: #FFF;
    }
    .cliente-edit-error{ min-height: 1.2em; margin-top: 8px; font-size: 0.9rem; color: #B91C1C; font-weight: 600; }
    @media (max-width: 680px){
      .cliente-modal-grid{ grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="admin-bar">
    <h1>Administración de Clientes</h1>
    <div class="actions">
      <button type="button" id="menuBtn" title="Menu">Menu</button>
      <button type="button" id="createClienteBtn" title="Crear Cliente">Crear Cliente</button>
      <button type="button" id="exportBtn" title="Exportar CSV">Exportar</button>
      <button type="button" id="printPdfBtn" title="Imprimir PDF">Imprimir PDF</button>
      <button type="button" id="logoutBtn" title="Salir">Salir</button>
    </div>
  </div>

  <div class="doc admin-doc">
    <section class="admin-grid">
      <div class="field">
        <label for="q">Buscar</label>
        <input id="q" placeholder="nombre, nif, teléfono, email, dirección, ciudad, provincia, cp" />
      </div>
      <div class="field">
        <label for="pageSize">Resultados</label>
        <select id="pageSize">
          <option>20</option>
          <option>50</option>
          <option>100</option>
        </select>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button id="searchBtn">Buscar</button>
      </div>
    </section>

    <div class="admin-table-wrap">
      <table id="clientesTable">
        <thead>
          <tr>
            <th class="sortable" data-sort="id">ID <span class="sort-icons"><span class="arrow-up">▲</span><span class="arrow-down">▼</span></span></th>
            <th class="sortable" data-sort="nif">NIF <span class="sort-icons"><span class="arrow-up">▲</span><span class="arrow-down">▼</span></span></th>
            <th class="sortable" data-sort="nombre">Nombre <span class="sort-icons"><span class="arrow-up">▲</span><span class="arrow-down">▼</span></span></th>
            <th class="sortable" data-sort="telefono">Teléfono <span class="sort-icons"><span class="arrow-up">▲</span><span class="arrow-down">▼</span></span></th>
            <th class="sortable" data-sort="email">Email <span class="sort-icons"><span class="arrow-up">▲</span><span class="arrow-down">▼</span></span></th>
            <th class="sortable" data-sort="direccion">Dirección <span class="sort-icons"><span class="arrow-up">▲</span><span class="arrow-down">▼</span></span></th>
            <th class="sortable" data-sort="ciudad">Ciudad <span class="sort-icons"><span class="arrow-up">▲</span><span class="arrow-down">▼</span></span></th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div id="clienteModalBackdrop" class="cliente-modal-backdrop" aria-hidden="true">
    <div class="cliente-modal" role="dialog" aria-modal="true" aria-labelledby="clienteModalTitle">
      <div class="cliente-modal-head">
        <h2 id="clienteModalTitle">Detalle de cliente</h2>
      </div>
      <div class="cliente-modal-grid">
        <div class="cliente-detail"><p class="cliente-detail-label">ID</p><p id="d_id" class="cliente-detail-value"></p></div>
        <div class="cliente-detail"><p class="cliente-detail-label">NIF</p><p id="d_nif" class="cliente-detail-value"></p></div>
        <div class="cliente-detail"><p class="cliente-detail-label">Nombre</p><p id="d_nombre" class="cliente-detail-value"></p></div>
        <div class="cliente-detail"><p class="cliente-detail-label">Telefono</p><p id="d_telefono" class="cliente-detail-value"></p></div>
        <div class="cliente-detail"><p class="cliente-detail-label">Email</p><p id="d_email" class="cliente-detail-value"></p></div>
        <div class="cliente-detail"><p class="cliente-detail-label">Direccion</p><p id="d_direccion" class="cliente-detail-value"></p></div>
        <div class="cliente-detail"><p class="cliente-detail-label">Ciudad</p><p id="d_ciudad" class="cliente-detail-value"></p></div>
        <div class="cliente-detail"><p class="cliente-detail-label">Provincia</p><p id="d_provincia" class="cliente-detail-value"></p></div>
        <div class="cliente-detail"><p class="cliente-detail-label">CP</p><p id="d_cp" class="cliente-detail-value"></p></div>
        <div class="cliente-detail"><p class="cliente-detail-label">Registro</p><p id="d_registro" class="cliente-detail-value"></p></div>
      </div>
      <div class="cliente-modal-actions">
        <button type="button" id="clienteModalClose">Cerrar</button>
        <button type="button" id="clienteModalEdit">Editar</button>
      </div>
    </div>
  </div>

  <div id="clienteEditBackdrop" class="cliente-modal-backdrop" aria-hidden="true">
    <div class="cliente-modal" role="dialog" aria-modal="true" aria-labelledby="clienteEditTitle">
      <div class="cliente-modal-head">
        <h2 id="clienteEditTitle">Editar cliente</h2>
      </div>
      <div class="cliente-modal-grid">
        <div class="cliente-detail"><p class="cliente-detail-label">ID</p><p id="e_id" class="cliente-detail-value"></p></div>
        <div class="cliente-detail"><p class="cliente-detail-label">NIF</p><input id="e_nif" class="cliente-edit-input" maxlength="15" /></div>
        <div class="cliente-detail"><p class="cliente-detail-label">Nombre</p><input id="e_nombre" class="cliente-edit-input" /></div>
        <div class="cliente-detail"><p class="cliente-detail-label">Telefono</p><input id="e_telefono" class="cliente-edit-input" inputmode="numeric" maxlength="9" /></div>
        <div class="cliente-detail"><p class="cliente-detail-label">Email</p><input id="e_email" class="cliente-edit-input" type="email" /></div>
        <div class="cliente-detail"><p class="cliente-detail-label">Direccion</p><input id="e_direccion" class="cliente-edit-input" /></div>
        <div class="cliente-detail"><p class="cliente-detail-label">Ciudad</p><input id="e_ciudad" class="cliente-edit-input" /></div>
        <div class="cliente-detail"><p class="cliente-detail-label">Provincia</p><input id="e_provincia" class="cliente-edit-input" /></div>
        <div class="cliente-detail"><p class="cliente-detail-label">CP</p><input id="e_cp" class="cliente-edit-input" /></div>
        <div class="cliente-detail"><p class="cliente-detail-label">Registro</p><p id="e_registro" class="cliente-detail-value"></p></div>
      </div>
      <div id="clienteEditError" class="cliente-edit-error"></div>
      <div class="cliente-modal-actions">
        <button type="button" id="clienteEditCancel">Cancelar</button>
        <button type="button" id="clienteEditSubmit">Enviar</button>
      </div>
    </div>
  </div>

  <script>
    const tbody = document.getElementById('tbody');
    const pageSizeSel = document.getElementById('pageSize');
    const clienteModalBackdrop = document.getElementById('clienteModalBackdrop');
    const clienteModalClose = document.getElementById('clienteModalClose');
    const clienteModalEdit = document.getElementById('clienteModalEdit');
    const clienteEditBackdrop = document.getElementById('clienteEditBackdrop');
    const clienteEditCancel = document.getElementById('clienteEditCancel');
    const clienteEditSubmit = document.getElementById('clienteEditSubmit');
    const clienteEditError = document.getElementById('clienteEditError');
    const clienteEditTitle = document.getElementById('clienteEditTitle');
    let currentRows = [];
    let activeDetailClientId = null;
    let editMode = 'edit';
    let currentSort = 'fecha_registro';
    let currentDir = 'desc';

    function escapeHtml(value){
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatDateTime(value){
      if(!value) return '';
      const dt = new Date(value);
      if(isNaN(dt)) return String(value);
      return dt.toLocaleString('es-ES');
    }

    function updateSortIndicators(){
      document.querySelectorAll('th.sortable').forEach((th) => {
        if(th.getAttribute('data-sort') === currentSort){ th.setAttribute('data-dir', currentDir); }
        else { th.removeAttribute('data-dir'); }
      });
    }

    function isValidNIF(value){
      if(!value) return false;
      const v = String(value).trim().toUpperCase();
      const dni = /^\d{8}[A-Z]$/;
      const nie = /^[XYZ]\d{7}[A-Z]$/;
      const cif = /^[ABCDEFGHJNPQRSUVW]\d{7}[A-Z0-9]$/;
      const letters = 'TRWAGMYFPDXBNJZSQVHLCKE';
      if(dni.test(v)){
        const num = parseInt(v.slice(0,8), 10);
        return letters[num % 23] === v.slice(8);
      }
      if(nie.test(v)){
        const map = { X: '0', Y: '1', Z: '2' };
        const num = parseInt(map[v[0]] + v.slice(1,8), 10);
        return letters[num % 23] === v.slice(8);
      }
      return cif.test(v);
    }

    function isValidPhone(value){
      return /^\d{9}$/.test(String(value || '').trim());
    }

    function isValidEmail(value){
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(value || '').trim());
    }

    function setDetail(fieldId, value){
      const el = document.getElementById(fieldId);
      if (!el) return;
      el.textContent = value == null || value === '' ? '-' : String(value);
    }

    function openClienteModal(cliente){
      activeDetailClientId = Number(cliente.id);
      setDetail('d_id', cliente.id);
      setDetail('d_nif', cliente.nif);
      setDetail('d_nombre', cliente.nombre);
      setDetail('d_telefono', cliente.telefono);
      setDetail('d_email', cliente.email);
      setDetail('d_direccion', cliente.direccion);
      setDetail('d_ciudad', cliente.ciudad);
      setDetail('d_provincia', cliente.provincia);
      setDetail('d_cp', cliente.cp);
      setDetail('d_registro', formatDateTime(cliente.fecha_registro));
      clienteModalBackdrop.classList.add('is-open');
      clienteModalBackdrop.setAttribute('aria-hidden', 'false');
    }

    function closeClienteModal(){
      activeDetailClientId = null;
      clienteModalBackdrop.classList.remove('is-open');
      clienteModalBackdrop.setAttribute('aria-hidden', 'true');
    }

    function openEditModal(cliente){
      editMode = 'edit';
      clienteEditTitle.textContent = 'Editar cliente';
      setDetail('e_id', cliente.id);
      setDetail('e_registro', formatDateTime(cliente.fecha_registro));
      document.getElementById('e_nif').value = cliente.nif || '';
      document.getElementById('e_nombre').value = cliente.nombre || '';
      document.getElementById('e_telefono').value = cliente.telefono || '';
      document.getElementById('e_email').value = cliente.email || '';
      document.getElementById('e_direccion').value = cliente.direccion || '';
      document.getElementById('e_ciudad').value = cliente.ciudad || '';
      document.getElementById('e_provincia').value = cliente.provincia || '';
      document.getElementById('e_cp').value = cliente.cp || '';
      clienteEditError.textContent = '';
      clienteEditBackdrop.classList.add('is-open');
      clienteEditBackdrop.setAttribute('aria-hidden', 'false');
      document.getElementById('e_nif').focus();
    }

    function openCreateModal(){
      editMode = 'create';
      activeDetailClientId = null;
      clienteEditTitle.textContent = 'Crear cliente';
      setDetail('e_id', '-');
      setDetail('e_registro', '-');
      document.getElementById('e_nif').value = '';
      document.getElementById('e_nombre').value = '';
      document.getElementById('e_telefono').value = '';
      document.getElementById('e_email').value = '';
      document.getElementById('e_direccion').value = '';
      document.getElementById('e_ciudad').value = '';
      document.getElementById('e_provincia').value = '';
      document.getElementById('e_cp').value = '';
      clienteEditError.textContent = '';
      clienteEditBackdrop.classList.add('is-open');
      clienteEditBackdrop.setAttribute('aria-hidden', 'false');
      document.getElementById('e_nif').focus();
    }

    function closeEditModal(){
      clienteEditBackdrop.classList.remove('is-open');
      clienteEditBackdrop.setAttribute('aria-hidden', 'true');
      clienteEditError.textContent = '';
      clienteEditSubmit.disabled = false;
      clienteEditCancel.disabled = false;
    }

    function reopenDetailFromActive(){
      const cliente = currentRows.find((r) => Number(r.id) === Number(activeDetailClientId));
      if (cliente) openClienteModal(cliente);
    }

    function handleEditFromDetail(){
      const cliente = currentRows.find((r) => Number(r.id) === Number(activeDetailClientId));
      if (!cliente) {
        alert('No se pudo cargar el cliente para editar.');
        return;
      }
      clienteModalBackdrop.classList.remove('is-open');
      clienteModalBackdrop.setAttribute('aria-hidden', 'true');
      openEditModal(cliente);
    }

    async function submitClienteEdit(){
      const nifValue = document.getElementById('e_nif').value.trim().toUpperCase();
      const nombreValue = document.getElementById('e_nombre').value.trim();
      const telefonoValue = document.getElementById('e_telefono').value.trim();
      const emailValue = document.getElementById('e_email').value.trim();
      const payload = {
        nif: nifValue,
        nombre: nombreValue,
        telefono: telefonoValue,
        email: emailValue,
        direccion: document.getElementById('e_direccion').value.trim(),
        ciudad: document.getElementById('e_ciudad').value.trim(),
        provincia: document.getElementById('e_provincia').value.trim(),
        cp: document.getElementById('e_cp').value.trim()
      };

      if (!nombreValue) {
        clienteEditError.textContent = 'El nombre es obligatorio.';
        document.getElementById('e_nombre').focus();
        return;
      }
      if (nifValue && !isValidNIF(nifValue)) {
        clienteEditError.textContent = 'Introduce un NIF/DNI/NIE/CIF valido.';
        document.getElementById('e_nif').focus();
        return;
      }
      if (!isValidPhone(telefonoValue)) {
        clienteEditError.textContent = 'El telefono debe tener exactamente 9 digitos.';
        document.getElementById('e_telefono').focus();
        return;
      }
      if (emailValue && !isValidEmail(emailValue)) {
        clienteEditError.textContent = 'Introduce un email valido.';
        document.getElementById('e_email').focus();
        return;
      }

      clienteEditSubmit.disabled = true;
      clienteEditCancel.disabled = true;
      clienteEditError.textContent = '';
      try {
        const isCreate = editMode === 'create';
        const id = Number(activeDetailClientId);
        const url = isCreate ? '/admin/api/clientes' : ('/admin/api/clientes/' + id);
        const method = isCreate ? 'POST' : 'PUT';
        if (!isCreate && !Number.isFinite(id)) {
          clienteEditError.textContent = 'No se pudo identificar el cliente a editar.';
          return;
        }
        const resp = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify(payload)
        });
        if (resp.status === 401) {
          location.href = '/admin';
          return;
        }
        const data = await resp.json();
        if (!data || !data.ok || !data.data) {
          clienteEditError.textContent = data?.error || (isCreate ? 'No se pudo crear el cliente.' : 'No se pudo actualizar el cliente.');
          return;
        }
        const updated = data.data;
        await load();
        closeEditModal();
        openClienteModal(updated);
      } catch (_err) {
        clienteEditError.textContent = editMode === 'create' ? 'Error creando cliente.' : 'Error actualizando cliente.';
      } finally {
        if (clienteEditBackdrop.classList.contains('is-open')) {
          clienteEditSubmit.disabled = false;
          clienteEditCancel.disabled = false;
        }
      }
    }

    function bindActions(){
      document.querySelectorAll('button.open').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          const cliente = currentRows.find((r) => String(r.id) === String(id));
          if (!cliente) {
            alert('No se pudo cargar el detalle del cliente.');
            return;
          }
          openClienteModal(cliente);
        });
      });
      document.querySelectorAll('button.del').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          alert('Eliminar cliente #' + id + ' aun no disponible.');
        });
      });
    }

    async function load(){
      const q = document.getElementById('q').value.trim();
      const pageSize = Number(pageSizeSel.value);
      const params = new URLSearchParams({ page: '1', pageSize, sort: currentSort, dir: currentDir });
      if (q) params.set('q', q);

      const res = await fetch('/admin/api/clientes?' + params.toString());
      const data = await res.json();
      if (!data.ok) {
        alert(data.error || 'Error cargando clientes.');
        return;
      }

      tbody.innerHTML = '';
      const rows = Array.isArray(data.data) ? data.data : [];
      currentRows = rows;
      for (const r of rows){
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${escapeHtml(r.id)}</td>
          <td>${escapeHtml(r.nif)}</td>
          <td>${escapeHtml(r.nombre)}</td>
          <td>${escapeHtml(r.telefono)}</td>
          <td>${escapeHtml(r.email)}</td>
          <td>${escapeHtml(r.direccion)}</td>
          <td>${escapeHtml(r.ciudad)}</td>
          <td>
            <span class="btn-row">
              <button data-id="${escapeHtml(r.id)}" class="open">Abrir</button>
              <button data-id="${escapeHtml(r.id)}" class="del">Eliminar</button>
            </span>
          </td>
        `;
        tbody.appendChild(tr);
      }

      bindActions();
      updateSortIndicators();
    }

    const thead = document.querySelector('table thead');
    if (thead) {
      thead.addEventListener('click', (ev) => {
        const th = ev.target.closest('th.sortable');
        if (!th) return;
        const col = th.getAttribute('data-sort');
        if (col === currentSort) currentDir = currentDir === 'asc' ? 'desc' : 'asc';
        else {
          currentSort = col;
          currentDir = 'asc';
        }
        load();
      });
    }

    document.getElementById('searchBtn').addEventListener('click', load);
    pageSizeSel.addEventListener('change', load);

    document.getElementById('menuBtn').addEventListener('click', () => {
      location.href = '/admin';
    });

    document.getElementById('createClienteBtn').addEventListener('click', openCreateModal);

    document.getElementById('exportBtn').addEventListener('click', () => {
      alert('Exportar clientes aun no disponible.');
    });

    document.getElementById('printPdfBtn').addEventListener('click', () => {
      alert('Imprimir PDF de clientes aun no disponible.');
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/admin/logout', { method: 'POST' });
      location.href = '/admin';
    });

    clienteModalClose.addEventListener('click', closeClienteModal);
    clienteModalEdit.addEventListener('click', handleEditFromDetail);
    clienteModalBackdrop.addEventListener('click', (ev) => {
      if (ev.target === clienteModalBackdrop) closeClienteModal();
    });
    clienteEditCancel.addEventListener('click', () => {
      closeEditModal();
      if (editMode === 'edit') reopenDetailFromActive();
    });
    clienteEditSubmit.addEventListener('click', submitClienteEdit);
    clienteEditBackdrop.addEventListener('click', (ev) => {
      if (ev.target === clienteEditBackdrop) {
        closeEditModal();
        if (editMode === 'edit') reopenDetailFromActive();
      }
    });
    document.addEventListener('keydown', (ev) => {
      if (ev.key !== 'Escape') return;
      if (clienteEditBackdrop.classList.contains('is-open')) {
        closeEditModal();
        if (editMode === 'edit') reopenDetailFromActive();
        return;
      }
      if (clienteModalBackdrop.classList.contains('is-open')) {
        closeClienteModal();
      }
    });

    load();
  </script>
</body>
</html>
