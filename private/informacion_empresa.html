<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Informacion de empresa</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .info-wrap{ max-width: 900px; margin: 0 auto; }
    .info-head{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: var(--space-lg);
    }
    .info-head h1{ margin: 0; color: var(--color-brown); }
    .info-company{
      border: 1px solid var(--color-border);
      border-radius: 12px;
      background: #fff;
      padding: 14px;
      box-shadow: var(--shadow-sm);
    }
    .info-company p{ margin: 0; font-weight: 700; color: var(--color-brown); }
    .info-actions{ margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
    .info-add-box{
      margin-top: 12px;
      display: none;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .info-add-box.is-visible{ display: flex; }
    .info-input{
      flex: 1;
      min-width: 220px;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
      color: var(--color-brown);
      background: #fff;
    }
    .info-list{
      margin-top: 14px;
      display: grid;
      gap: 8px;
    }
    .info-item{
      border: 1px solid var(--color-border);
      border-radius: 8px;
      background: #fff;
      padding: 10px;
      color: var(--color-brown);
      word-break: break-word;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .info-item-text{ flex: 1; }
    .info-remove-btn{
      border: 1px solid #DC2626;
      background: #FEE2E2;
      color: #B91C1C;
      border-radius: 999px;
      width: 24px;
      height: 24px;
      line-height: 1;
      font-weight: 800;
      cursor: pointer;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .info-remove-btn:hover{
      background: #FCA5A5;
      color: #7F1D1D;
    }
  </style>
</head>
<body>
  <div class="info-wrap">
    <section class="doc">
      <div class="info-head">
        <h1>Informacion de empresa</h1>
        <button type="button" id="menuBtn" title="Menu">Menu</button>
      </div>

      <div class="info-company">
        <p>Roizmundo C.B.</p>

        <div id="infoList" class="info-list" aria-live="polite"></div>

        <div class="info-actions">
          <button type="button" id="showAddBtn">Añadir Información</button>
        </div>

        <div id="addBox" class="info-add-box" aria-hidden="true">
          <input id="infoInput" class="info-input" type="text" placeholder="Escribe la información" />
          <button type="button" id="addInfoBtn">Añadir</button>
        </div>
      </div>
    </section>
  </div>

  <script>
    const showAddBtn = document.getElementById('showAddBtn');
    const addBox = document.getElementById('addBox');
    const infoInput = document.getElementById('infoInput');
    const addInfoBtn = document.getElementById('addInfoBtn');
    const infoList = document.getElementById('infoList');
    const menuBtn = document.getElementById('menuBtn');

    async function requestApi(url, options){
      const response = await fetch(url, options);
      const result = await response.json();
      if(!response.ok || !result.ok){
        throw new Error(result.error || 'No se pudo completar la operación.');
      }
      return result;
    }

    async function deleteInfo(id){
      const confirmed = confirm('¿Deseas eliminar esta información?');
      if(!confirmed) return;
      try {
        await requestApi(`/admin/api/info-empresa/${id}`, { method: 'DELETE' });
        await renderItems();
      } catch(err){
        alert(err.message);
      }
    }

    async function renderItems(){
      const result = await requestApi('/admin/api/info-empresa');
      const items = result.data || [];
      infoList.innerHTML = '';
      items.forEach((itemData) => {
        const item = document.createElement('div');
        item.className = 'info-item';

        const itemText = document.createElement('div');
        itemText.className = 'info-item-text';
        itemText.textContent = itemData.informacion;

        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'info-remove-btn';
        removeBtn.textContent = 'X';
        removeBtn.setAttribute('title', 'Eliminar');
        removeBtn.setAttribute('aria-label', 'Eliminar información');
        removeBtn.addEventListener('click', () => deleteInfo(itemData.id));

        item.appendChild(itemText);
        item.appendChild(removeBtn);
        infoList.appendChild(item);
      });
    }

    showAddBtn.addEventListener('click', () => {
      addBox.classList.add('is-visible');
      addBox.setAttribute('aria-hidden', 'false');
      infoInput.focus();
    });

    async function addInfo(){
      const value = String(infoInput.value || '').trim();
      if(!value) return;
      try {
        await requestApi('/admin/api/info-empresa', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ informacion: value })
        });
        infoInput.value = '';
        await renderItems();
        infoInput.focus();
      } catch(err){
        alert(err.message);
      }
    }

    addInfoBtn.addEventListener('click', addInfo);
    infoInput.addEventListener('keydown', (ev) => {
      if(ev.key === 'Enter') addInfo();
    });

    menuBtn.addEventListener('click', () => {
      location.href = '/admin';
    });

    renderItems().catch((err) => {
      infoList.textContent = err.message;
    });
  </script>
</body>
</html>
