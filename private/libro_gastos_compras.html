<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Libro de gastos y compras</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .admin-bar{ max-width: 1200px; margin: 0 auto var(--space-lg); display:flex; align-items:center; justify-content: space-between; }
    .menu-toggle-btn{
      display: none;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 1px solid var(--color-border);
      background: var(--color-primary);
      color: var(--color-brown);
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
    }
    @media (max-width: 680px){
      .admin-bar{ flex-wrap: wrap; position: relative; }
      .menu-toggle-btn{ display: inline-flex; }
      .admin-bar .actions{
        display: none;
        flex-direction: column;
        gap: 8px;
        width: 100%;
        margin-top: 10px;
      }
      .admin-bar .actions.is-open{ display: flex; }
    }
    .admin-grid{ display:grid; grid-template-columns: 2.1fr 1fr 1fr 1fr auto; gap: 12px; align-items:end; }
    #filtrosToggleBtn{ display: none; }
    .filtros-panel-head{ display: none; }
    .filtros-close-btn{ display: none; }
    @media (max-width: 680px){
      #filtrosToggleBtn{ display: inline-flex; }
      .filtros-backdrop{
        position: fixed;
        inset: 0;
        background: rgba(43, 30, 24, 0.42);
        display: none;
        align-items: flex-start;
        justify-content: center;
        padding: 16px;
        overflow-y: auto;
        z-index: 1000;
      }
      .filtros-backdrop.is-open{ display: flex; }
      .filtros-panel{
        background: #FFF;
        border-radius: var(--radius);
        box-shadow: var(--shadow-md);
        padding: 20px;
        width: 100%;
        max-width: 420px;
      }
      .filtros-panel-head{
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .filtros-panel-head h2{ margin: 0; color: var(--color-brown); font-size: 1.15rem; }
      .filtros-close-btn{
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        border: 1px solid var(--color-border);
        background: #FFF;
        color: var(--color-brown);
        font-size: 1.2rem;
        line-height: 1;
        cursor: pointer;
      }
      .filtros-backdrop .admin-grid{
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }
    }
    .admin-table-wrap{ max-width: 1200px; margin: 0 auto; overflow-x: auto; }
    .admin-doc{ max-width: 1200px; margin: 0 auto; }
    #registrosTable{ min-width: max-content; }
    #registrosTable th{
      font-size: 0.72rem;
      line-height: 1.15;
      padding: 8px 6px;
      white-space: nowrap;
    }
    th.sortable{ cursor: pointer; user-select: none; white-space: nowrap; }
    th .sort-icons{ margin-left: 3px; font-size: 0.68rem; color: var(--color-muted); display:inline-flex; gap:1px; }
    th[data-dir="asc"] .arrow-up{ color: var(--color-brown); }
    th[data-dir="desc"] .arrow-down{ color: var(--color-brown); }
    .btn-row{ display:inline-flex; align-items:center; gap:8px; white-space: nowrap; }
    .view-switch{ display: flex; justify-content: flex-start; gap: 8px; margin: 0 0 10px; }
    .view-toggle{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 96px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      background: var(--color-primary);
      color: var(--color-brown);
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease;
    }
    .view-toggle:hover{ border-color: var(--color-brown); }
    .view-toggle.is-active{
      background: #E5E7EB;
      border-color: #D1D5DB;
      color: #374151;
    }
    .load-more-btn{
      display: block;
      margin: 14px auto 0;
      min-width: 160px;
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      background: var(--color-primary);
      color: var(--color-brown);
      font-weight: 800;
      cursor: pointer;
    }
    .load-more-btn:hover{ border-color: var(--color-brown); }
    .load-more-btn:disabled{ opacity: 0.6; cursor: default; }
    .cards-grid{
      display: none;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
      margin-top: 8px;
    }
    .cards-grid.is-visible{ display: grid; }
    .registro-card{
      border: 1px solid var(--color-border);
      border-radius: 12px;
      background: #FFF;
      padding: 12px;
      box-shadow: var(--shadow-sm);
    }
    .registro-card-head{
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .registro-card-id{ font-weight: 800; color: var(--color-brown); }
    .registro-card-tipo{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 10px;
      border-radius: 999px;
      background: #F9EAB4;
      color: var(--color-brown);
      font-weight: 700;
      font-size: 0.85rem;
    }
    .registro-card-grid{
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }
    .registro-card-row{
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: baseline;
    }
    .registro-card-label{ color: var(--color-muted); font-size: 0.9rem; }
    .registro-card-value{ font-weight: 700; text-align: right; }
    .empty-state{
      display: none;
      margin: 18px 0 0;
      padding: 18px;
      border: 1px dashed var(--color-border);
      border-radius: 12px;
      background: #FFF;
      color: var(--color-muted);
      font-weight: 600;
      text-align: center;
    }
    .empty-state.is-visible{ display: block; }
    @media (max-width: 560px){
      .cards-grid{ grid-template-columns: 1fr; }
    }
    @media (max-width: 680px){
      #viewTablaBtn{ display: none; }
      #registrosTable{ display: none !important; }
    }
  </style>
</head>
<body>
  <div class="admin-bar">
    <h1>Libro de gastos y compras</h1>
    <button type="button" id="menuToggleBtn" class="menu-toggle-btn" aria-label="Abrir menú" aria-expanded="false" aria-controls="actionsMenu">☰</button>
    <div class="actions" id="actionsMenu">
      <button type="button" id="menuBtn" title="Menu">Menu</button>
      <button type="button" id="createRegistroBtn" title="Crear registro">Crear registro</button>
      <button type="button" id="exportBtn" title="Exportar CSV">Exportar</button>
      <button type="button" id="printPdfBtn" title="Imprimir PDF">Imprimir PDF</button>
    </div>
  </div>

  <div class="doc admin-doc">
    <div id="filtrosBackdrop" class="filtros-backdrop">
      <div class="filtros-panel">
        <div class="filtros-panel-head">
          <h2>Filtros</h2>
          <button type="button" id="filtrosCloseBtn" class="filtros-close-btn" aria-label="Cerrar">&times;</button>
        </div>
        <section class="admin-grid">
          <div class="field">
            <label for="q">Buscar</label>
            <input id="q" placeholder="proveedor, NIF/CIF, factura, tipo" />
          </div>
          <div class="field">
            <label for="desde">Desde</label>
            <input id="desde" type="date" />
          </div>
          <div class="field">
            <label for="hasta">Hasta</label>
            <input id="hasta" type="date" />
          </div>
          <div class="field">
            <label for="pageSize">Resultados</label>
            <select id="pageSize">
              <option>20</option>
              <option selected>50</option>
              <option>100</option>
              <option value="all">Todos</option>
            </select>
          </div>
          <div class="field">
            <label>&nbsp;</label>
            <button id="searchBtn">Buscar</button>
          </div>
        </section>
      </div>
    </div>

    <div class="admin-table-wrap">
      <div class="view-switch" aria-label="Cambiar vista del libro de gastos y compras">
        <button type="button" id="viewTablaBtn" class="view-toggle is-active" aria-current="page">Tabla</button>
        <button type="button" id="viewFichasBtn" class="view-toggle">Fichas</button>
        <button type="button" id="filtrosToggleBtn" class="view-toggle">Filtros</button>
      </div>
      <table id="registrosTable">
        <thead>
          <tr>
            <th class="sortable" data-sort="id">Id <span class="sort-icons"><span class="arrow-up">▲</span><span class="arrow-down">▼</span></span></th>
            <th class="sortable" data-sort="numero_registro">Nº reg. <span class="sort-icons"><span class="arrow-up">▲</span><span class="arrow-down">▼</span></span></th>
            <th class="sortable" data-sort="fecha_factura">Fecha <span class="sort-icons"><span class="arrow-up">▲</span><span class="arrow-down">▼</span></span></th>
            <th class="sortable" data-sort="proveedor_nombre">Proveedor <span class="sort-icons"><span class="arrow-up">▲</span><span class="arrow-down">▼</span></span></th>
            <th class="sortable" data-sort="nif_cif">N.I.F. / C.I.F. <span class="sort-icons"><span class="arrow-up">▲</span><span class="arrow-down">▼</span></span></th>
            <th class="sortable" data-sort="numero_factura">Nº factura <span class="sort-icons"><span class="arrow-up">▲</span><span class="arrow-down">▼</span></span></th>
            <th class="sortable" data-sort="tipo_compra_gasto">Tipo C/G<span class="sort-icons"><span class="arrow-up">▲</span><span class="arrow-down">▼</span></span></th>
            <th class="sortable" data-sort="iva_4">IVA 4% <span class="sort-icons"><span class="arrow-up">▲</span><span class="arrow-down">▼</span></span></th>
            <th class="sortable" data-sort="iva_10">IVA 10% <span class="sort-icons"><span class="arrow-up">▲</span><span class="arrow-down">▼</span></span></th>
            <th class="sortable" data-sort="iva_21">IVA 21% <span class="sort-icons"><span class="arrow-up">▲</span><span class="arrow-down">▼</span></span></th>
            <th class="sortable" data-sort="ret_percent">RET % <span class="sort-icons"><span class="arrow-up">▲</span><span class="arrow-down">▼</span></span></th>
            <th class="sortable" data-sort="retencion">Retencion <span class="sort-icons"><span class="arrow-up">▲</span><span class="arrow-down">▼</span></span></th>
            <th class="sortable" data-sort="total_factura">TOTAL<span class="sort-icons"><span class="arrow-up">▲</span><span class="arrow-down">▼</span></span></th>
            <th>ACCIONES</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="cardsGrid" class="cards-grid"></div>
      <div id="emptyState" class="empty-state">No hay registros en el libro de gastos y compras.</div>
      <button type="button" id="loadMoreBtn" class="load-more-btn" style="display:none;">Cargar más</button>
    </div>
  </div>

  <div id="actionAlertModal" class="confirm-modal-backdrop hidden" aria-hidden="true">
    <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="actionAlertTitle">
      <div class="confirm-head">
        <h2 id="actionAlertTitle" class="confirm-title">Aviso</h2>
      </div>
      <p id="actionAlertText" class="confirm-status"></p>
      <div class="confirm-actions">
        <button type="button" id="actionAlertAccept">Aceptar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.3/dist/jspdf.plugin.autotable.min.js"></script>
  <script>
    const STORAGE_KEY = 'libroGastosComprasRecords';
    const tbody = document.getElementById('tbody');
    const pageSizeSel = document.getElementById('pageSize');
    const registrosTable = document.getElementById('registrosTable');
    const cardsGrid = document.getElementById('cardsGrid');
    const emptyState = document.getElementById('emptyState');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    const viewTablaBtn = document.getElementById('viewTablaBtn');
    const viewFichasBtn = document.getElementById('viewFichasBtn');
    const actionAlertModal = document.getElementById('actionAlertModal');
    const actionAlertTitle = document.getElementById('actionAlertTitle');
    const actionAlertText = document.getElementById('actionAlertText');
    const actionAlertAccept = document.getElementById('actionAlertAccept');
    let actionAlertResolver = null;
    const isMobileView = () => window.matchMedia('(max-width: 680px)').matches;
    let currentView = isMobileView() ? 'fichas' : 'tabla';
    let currentSort = 'id';
    let currentDir = 'asc';
    let currentRows = [];
    let filteredRows = [];
    let visibleCount = 0;

    function closeActionAlertModal(){
      actionAlertModal.classList.add('hidden');
      actionAlertModal.setAttribute('aria-hidden', 'true');
      actionAlertText.classList.remove('error');
      if(actionAlertResolver){
        const resolve = actionAlertResolver;
        actionAlertResolver = null;
        resolve(true);
      }
    }

    function showActionAlert({ title, message, acceptText, type }){
      const resolvedType = type || ((title || '').toLowerCase() === 'error' ? 'error' : 'info');
      actionAlertTitle.textContent = title || (resolvedType === 'error' ? 'Error' : 'Aviso');
      actionAlertText.textContent = message || '';
      actionAlertText.classList.toggle('error', resolvedType === 'error');
      actionAlertAccept.textContent = acceptText || 'Aceptar';
      actionAlertModal.classList.remove('hidden');
      actionAlertModal.setAttribute('aria-hidden', 'false');
      actionAlertAccept.focus();
      return new Promise((resolve) => {
        actionAlertResolver = resolve;
      });
    }

    function loadStoredRows(){
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch(_error){
        return [];
      }
    }

    function formatDate(value){
      if(!value) return '';
      const text = String(value).trim();
      if(/^\d{4}-\d{2}-\d{2}$/.test(text)){
        const parts = text.split('-');
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
      }
      const dt = new Date(text);
      return Number.isNaN(dt.getTime()) ? text : dt.toLocaleDateString('es-ES');
    }

    function formatMoney(value){
      const number = Number(value || 0);
      return `${number.toFixed(2).replace('.', ',')} €`;
    }

    function formatPercent(value){
      const number = Number(value || 0);
      return `${number.toFixed(2).replace('.', ',')}%`;
    }

    function normalizeText(value){
      return String(value || '').trim().toLowerCase();
    }

    function toNumber(value){
      const number = Number(value);
      return Number.isFinite(number) ? number : 0;
    }

    function toDateValue(value){
      const text = String(value || '').trim();
      if(/^\d{4}-\d{2}-\d{2}$/.test(text)) return new Date(`${text}T00:00:00`).getTime();
      const dt = new Date(text);
      return Number.isNaN(dt.getTime()) ? 0 : dt.getTime();
    }

    function sortRows(rows){
      const factor = currentDir === 'asc' ? 1 : -1;
      rows.sort((a, b) => {
        let comparison = 0;
        switch(currentSort){
          case 'id':
          case 'iva_4':
          case 'iva_10':
          case 'iva_21':
          case 'ret_percent':
          case 'retencion':
          case 'total_factura':
            comparison = toNumber(a[currentSort]) - toNumber(b[currentSort]);
            break;
          case 'fecha_factura':
            comparison = toDateValue(a.fecha_factura) - toDateValue(b.fecha_factura);
            break;
          default:
            comparison = normalizeText(a[currentSort]).localeCompare(normalizeText(b[currentSort]), 'es');
            break;
        }
        return comparison * factor;
      });
    }

    function getSearchedRows(){
      const query = normalizeText(document.getElementById('q').value);
      const desde = document.getElementById('desde').value;
      const hasta = document.getElementById('hasta').value;
      const desdeMs = desde ? toDateValue(desde) : null;
      const hastaMs = hasta ? toDateValue(hasta) : null;

      return loadStoredRows().filter((row) => {
        const searchFields = [
          row.numero_registro,
          row.proveedor_nombre,
          row.nif_cif,
          row.numero_factura,
          row.tipo_compra_gasto
        ].map(normalizeText);
        const rowDateMs = toDateValue(row.fecha_factura);
        const matchesQuery = !query || searchFields.some((field) => field.includes(query));
        const matchesDesde = desdeMs === null || rowDateMs >= desdeMs;
        const matchesHasta = hastaMs === null || rowDateMs <= hastaMs;
        return matchesQuery && matchesDesde && matchesHasta;
      });
    }

    function buildVisibleRows(){
      const pageSize = pageSizeSel.value === 'all' ? filteredRows.length : Number(pageSizeSel.value) || 50;
      visibleCount = pageSizeSel.value === 'all'
        ? filteredRows.length
        : Math.min(Math.max(visibleCount || pageSize, pageSize), filteredRows.length);
      currentRows = filteredRows.slice(0, visibleCount);
    }

    function updateSortIndicators(){
      document.querySelectorAll('th.sortable').forEach((th) => {
        if(th.getAttribute('data-sort') === currentSort) th.setAttribute('data-dir', currentDir);
        else th.removeAttribute('data-dir');
      });
    }

    function renderCard(row){
      return `
        <article class="registro-card">
          <div class="registro-card-head">
            <span class="registro-card-id">#${row.id ?? ''} · ${row.numero_registro || '-'}</span>
            <span class="registro-card-tipo">${row.tipo_compra_gasto || '-'}</span>
          </div>
          <div class="registro-card-grid">
            <div class="registro-card-row"><span class="registro-card-label">Fecha factura</span><span class="registro-card-value">${formatDate(row.fecha_factura)}</span></div>
            <div class="registro-card-row"><span class="registro-card-label">Proveedor</span><span class="registro-card-value">${row.proveedor_nombre || ''}</span></div>
            <div class="registro-card-row"><span class="registro-card-label">N.I.F. / C.I.F.</span><span class="registro-card-value">${row.nif_cif || ''}</span></div>
            <div class="registro-card-row"><span class="registro-card-label">Nº factura</span><span class="registro-card-value">${row.numero_factura || ''}</span></div>
            <div class="registro-card-row"><span class="registro-card-label">IVA 4%</span><span class="registro-card-value">${formatMoney(row.iva_4)}</span></div>
            <div class="registro-card-row"><span class="registro-card-label">IVA 10%</span><span class="registro-card-value">${formatMoney(row.iva_10)}</span></div>
            <div class="registro-card-row"><span class="registro-card-label">IVA 21%</span><span class="registro-card-value">${formatMoney(row.iva_21)}</span></div>
            <div class="registro-card-row"><span class="registro-card-label">RET %</span><span class="registro-card-value">${formatPercent(row.ret_percent)}</span></div>
            <div class="registro-card-row"><span class="registro-card-label">RETENCION</span><span class="registro-card-value">${formatMoney(row.retencion)}</span></div>
            <div class="registro-card-row"><span class="registro-card-label">TOTAL FACTURA</span><span class="registro-card-value">${formatMoney(row.total_factura)}</span></div>
          </div>
          <span class="btn-row">
            <button type="button" class="open" data-id="${row.id}">Abrir</button>
          </span>
        </article>
      `;
    }

    function bindActions(){
      document.querySelectorAll('button.open').forEach((button) => {
        button.addEventListener('click', async () => {
          await showActionAlert({ title: 'Aviso', message: 'La apertura de registros aún no está disponible.' });
        });
      });
    }

    function renderRows(){
      tbody.innerHTML = '';
      cardsGrid.innerHTML = '';
      currentRows.forEach((row) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${row.id ?? ''}</td>
          <td>${row.numero_registro || ''}</td>
          <td>${formatDate(row.fecha_factura)}</td>
          <td>${row.proveedor_nombre || ''}</td>
          <td>${row.nif_cif || ''}</td>
          <td>${row.numero_factura || ''}</td>
          <td>${row.tipo_compra_gasto || ''}</td>
          <td>${formatMoney(row.iva_4)}</td>
          <td>${formatMoney(row.iva_10)}</td>
          <td>${formatMoney(row.iva_21)}</td>
          <td>${formatPercent(row.ret_percent)}</td>
          <td>${formatMoney(row.retencion)}</td>
          <td>${formatMoney(row.total_factura)}</td>
          <td><span class="btn-row"><button type="button" class="open" data-id="${row.id}">Abrir</button></span></td>
        `;
        tbody.appendChild(tr);
        cardsGrid.insertAdjacentHTML('beforeend', renderCard(row));
      });
      emptyState.classList.toggle('is-visible', currentRows.length === 0);
      bindActions();
      updateSortIndicators();
      applyCurrentView();
      updateLoadMoreButton();
    }

    function applyCurrentView(){
      if(isMobileView() && currentView === 'tabla') currentView = 'fichas';
      const showTabla = currentView === 'tabla';
      const showFichas = currentView === 'fichas';
      registrosTable.style.display = showTabla ? 'table' : 'none';
      cardsGrid.classList.toggle('is-visible', showFichas);
      viewTablaBtn.classList.toggle('is-active', showTabla);
      viewFichasBtn.classList.toggle('is-active', showFichas);
      if(showTabla) viewTablaBtn.setAttribute('aria-current', 'page');
      else viewTablaBtn.removeAttribute('aria-current');
      if(showFichas) viewFichasBtn.setAttribute('aria-current', 'page');
      else viewFichasBtn.removeAttribute('aria-current');
    }

    function updateLoadMoreButton(){
      const hasMore = currentRows.length < filteredRows.length;
      loadMoreBtn.style.display = (pageSizeSel.value !== 'all' && hasMore) ? '' : 'none';
      loadMoreBtn.disabled = !hasMore;
    }

    function load(){
      filteredRows = getSearchedRows();
      sortRows(filteredRows);
      buildVisibleRows();
      renderRows();
    }

    function loadMore(){
      const pageSize = Number(pageSizeSel.value) || 50;
      visibleCount = Math.min(visibleCount + pageSize, filteredRows.length);
      currentRows = filteredRows.slice(0, visibleCount);
      renderRows();
    }

    function downloadCsv(){
      if(!Array.isArray(currentRows) || currentRows.length === 0){
        showActionAlert({ title: 'Aviso', message: 'No hay registros para exportar.' });
        return;
      }
      const headers = [
        'Id', 'Nº registro', 'Fecha factura', 'Proveedor', 'N.I.F. / C.I.F.', 'Nº factura',
        'Tipo compra/gasto', 'IVA 4%', 'IVA 10%', 'IVA 21%', 'RET %', 'RETENCION', 'TOTAL FACTURA'
      ];
      const lines = currentRows.map((row) => [
        row.id ?? '',
        row.numero_registro || '',
        formatDate(row.fecha_factura),
        row.proveedor_nombre || '',
        row.nif_cif || '',
        row.numero_factura || '',
        row.tipo_compra_gasto || '',
        toNumber(row.iva_4).toFixed(2),
        toNumber(row.iva_10).toFixed(2),
        toNumber(row.iva_21).toFixed(2),
        toNumber(row.ret_percent).toFixed(2),
        toNumber(row.retencion).toFixed(2),
        toNumber(row.total_factura).toFixed(2)
      ].map((value) => `"${String(value).replace(/"/g, '""')}"`).join(','));
      const csv = [headers.join(','), ...lines].join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `libro_gastos_compras_${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function downloadPdf(){
      if(!window.jspdf || !window.jspdf.jsPDF || typeof window.jspdf.jsPDF !== 'function'){
        showActionAlert({ title: 'Error', message: 'No se pudo cargar la librería PDF. Inténtalo de nuevo.' });
        return;
      }
      if(!Array.isArray(currentRows) || currentRows.length === 0){
        showActionAlert({ title: 'Aviso', message: 'No hay registros para imprimir en PDF.' });
        return;
      }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
      const now = new Date();
      doc.setFontSize(16);
      doc.text('Libro de gastos y compras', 40, 40);
      doc.setFontSize(10);
      doc.text(`Generado: ${now.toLocaleString('es-ES')}`, 40, 58);
      doc.autoTable({
        startY: 72,
        head: [[
          'Id', 'Nº registro', 'Fecha factura', 'Proveedor', 'N.I.F. / C.I.F.', 'Nº factura',
          'Tipo compra/gasto', 'IVA 4%', 'IVA 10%', 'IVA 21%', 'RET %', 'RETENCION', 'TOTAL FACTURA'
        ]],
        body: currentRows.map((row) => [
          row.id ?? '',
          row.numero_registro || '',
          formatDate(row.fecha_factura),
          row.proveedor_nombre || '',
          row.nif_cif || '',
          row.numero_factura || '',
          row.tipo_compra_gasto || '',
          formatMoney(row.iva_4),
          formatMoney(row.iva_10),
          formatMoney(row.iva_21),
          formatPercent(row.ret_percent),
          formatMoney(row.retencion),
          formatMoney(row.total_factura)
        ]),
        styles: { fontSize: 8, cellPadding: 4 },
        headStyles: { fillColor: [255, 210, 0], textColor: [91, 58, 46] },
        alternateRowStyles: { fillColor: [248, 248, 248] },
        theme: 'striped'
      });
      doc.save(`libro_gastos_compras_${now.toISOString().slice(0, 10)}.pdf`);
    }

    const thead = document.querySelector('#registrosTable thead');
    if(thead){
      thead.addEventListener('click', (event) => {
        const th = event.target.closest('th.sortable');
        if(!th) return;
        const nextSort = th.getAttribute('data-sort');
        if(nextSort === currentSort) currentDir = currentDir === 'asc' ? 'desc' : 'asc';
        else {
          currentSort = nextSort;
          currentDir = 'asc';
        }
        load();
      });
    }

    viewTablaBtn.addEventListener('click', () => {
      if(isMobileView()) return;
      currentView = 'tabla';
      applyCurrentView();
    });
    viewFichasBtn.addEventListener('click', () => {
      currentView = 'fichas';
      applyCurrentView();
    });
    window.addEventListener('resize', applyCurrentView);

    const menuToggleBtn = document.getElementById('menuToggleBtn');
    const actionsMenu = document.getElementById('actionsMenu');
    if(menuToggleBtn && actionsMenu){
      menuToggleBtn.addEventListener('click', () => {
        const isOpen = actionsMenu.classList.toggle('is-open');
        menuToggleBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      });
      actionsMenu.addEventListener('click', (event) => {
        if(event.target.closest('button')){
          actionsMenu.classList.remove('is-open');
          menuToggleBtn.setAttribute('aria-expanded', 'false');
        }
      });
      window.addEventListener('resize', () => {
        if(!isMobileView()){
          actionsMenu.classList.remove('is-open');
          menuToggleBtn.setAttribute('aria-expanded', 'false');
        }
      });
    }

    const filtrosToggleBtn = document.getElementById('filtrosToggleBtn');
    const filtrosBackdrop = document.getElementById('filtrosBackdrop');
    const filtrosCloseBtn = document.getElementById('filtrosCloseBtn');
    if(filtrosToggleBtn && filtrosBackdrop){
      const closeFiltros = () => filtrosBackdrop.classList.remove('is-open');
      filtrosToggleBtn.addEventListener('click', () => filtrosBackdrop.classList.add('is-open'));
      if(filtrosCloseBtn) filtrosCloseBtn.addEventListener('click', closeFiltros);
      filtrosBackdrop.addEventListener('click', (event) => {
        if(event.target === filtrosBackdrop) closeFiltros();
      });
      document.getElementById('searchBtn').addEventListener('click', closeFiltros);
      window.addEventListener('resize', () => {
        if(!isMobileView()) closeFiltros();
      });
    }

    actionAlertAccept.addEventListener('click', closeActionAlertModal);
    actionAlertModal.addEventListener('click', (event) => {
      if(event.target === actionAlertModal) closeActionAlertModal();
    });
    document.addEventListener('keydown', (event) => {
      if(event.key === 'Escape' && !actionAlertModal.classList.contains('hidden')){
        closeActionAlertModal();
        return;
      }
      if(event.key === 'Escape' && filtrosBackdrop && filtrosBackdrop.classList.contains('is-open')){
        filtrosBackdrop.classList.remove('is-open');
      }
    });

    document.getElementById('searchBtn').addEventListener('click', () => {
      visibleCount = 0;
      load();
    });
    pageSizeSel.addEventListener('change', () => {
      visibleCount = 0;
      load();
    });
    loadMoreBtn.addEventListener('click', loadMore);

    document.getElementById('menuBtn').addEventListener('click', () => {
      location.href = '/admin';
    });
    document.getElementById('createRegistroBtn').addEventListener('click', async () => {
      location.href = '/admin/crear-registro-libro';
    });
    document.getElementById('exportBtn').addEventListener('click', downloadCsv);
    document.getElementById('printPdfBtn').addEventListener('click', downloadPdf);

    load();
  </script>
</body>
</html>
