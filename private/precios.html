<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Cambio de precios</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .precios-wrap{ max-width: 900px; margin: 0 auto; }
    .precios-head{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: var(--space-lg);
    }
    .precios-head h1{ margin: 0; color: var(--color-brown); }
    .precios-list{
      display: grid;
      gap: 12px;
    }
    .precio-item{
      border: 1px solid var(--color-border);
      border-radius: 12px;
      background: #fff;
      padding: 14px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .precio-item-info{ display: flex; flex-direction: column; gap: 4px; }
    .precio-item-nombre{ font-weight: 800; color: var(--color-brown); font-size: 1.05rem; }
    .precio-item-valor{ font-weight: 700; color: var(--color-brown); }
    .precio-item-nota{ color: var(--color-muted); font-size: 0.85rem; }
    .precio-status{ color: var(--color-muted); margin-bottom: 10px; }
    .precio-status.error{ color: #B91C1C; }

    /* Modal "Cambiar precio", mismo estilo que el modal de cambiar estado de pedidos.html */
    .estado-modal-backdrop{
      position: fixed;
      inset: 0;
      background: rgba(43, 30, 24, 0.42);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }
    .estado-modal-backdrop.is-open{ display: flex; }
    .estado-modal{
      width: min(100%, 420px);
      background: #FFF;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      padding: 20px;
    }
    .estado-modal h2{ margin: 0 0 8px; color: var(--color-brown); font-size: 1.25rem; }
    .estado-modal p{ margin: 0 0 16px; color: var(--color-muted); }
    .estado-modal-actions{ display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
    .estado-modal-error{ min-height: 1.5em; margin-top: 10px; color: #B91C1C; font-weight: 600; }
  </style>
</head>
<body>
  <div class="precios-wrap">
    <section class="doc">
      <div class="precios-head">
        <h1>Cambio de precios</h1>
        <button type="button" id="menuBtn" title="Menu">Menu</button>
      </div>

      <p id="preciosStatus" class="precio-status"></p>

      <div id="preciosList" class="precios-list" aria-live="polite"></div>
    </section>
  </div>

  <div id="precioModalBackdrop" class="estado-modal-backdrop" aria-hidden="true">
    <div class="estado-modal" role="dialog" aria-modal="true" aria-labelledby="precioModalTitle">
      <h2 id="precioModalTitle">Cambiar precio</h2>
      <p id="precioModalNombre"></p>
      <div class="field">
        <label for="precioModalInput">Nuevo precio con IVA</label>
        <input id="precioModalInput" type="number" step="0.01" min="0" inputmode="decimal" />
      </div>
      <div id="precioModalError" class="estado-modal-error"></div>
      <div class="estado-modal-actions">
        <button type="button" id="precioModalCancel">Cancelar</button>
        <button type="button" id="precioModalSave">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    const PRODUCTOS = [
      { key: 'churro', nombre: 'Churro' },
      { key: 'chocolate', nombre: 'Chocolate' },
      { key: 'envio', nombre: 'Envío' }
    ];

    const preciosList = document.getElementById('preciosList');
    const preciosStatus = document.getElementById('preciosStatus');
    const menuBtn = document.getElementById('menuBtn');
    const precioModalBackdrop = document.getElementById('precioModalBackdrop');
    const precioModalNombre = document.getElementById('precioModalNombre');
    const precioModalInput = document.getElementById('precioModalInput');
    const precioModalError = document.getElementById('precioModalError');
    const precioModalCancel = document.getElementById('precioModalCancel');
    const precioModalSave = document.getElementById('precioModalSave');

    const nf = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' });
    let precios = { churro: 0, chocolate: 0, envio: 0 };
    let editingKey = null;

    function renderPrecios(){
      preciosList.innerHTML = PRODUCTOS.map(({ key, nombre }) => `
        <article class="precio-item">
          <div class="precio-item-info">
            <span class="precio-item-nombre">${nombre}</span>
            <span class="precio-item-valor">${nf.format(Number(precios[key] || 0))} <span class="precio-item-nota">(con IVA, por unidad)</span></span>
          </div>
          <button type="button" class="precio-cambiar-btn" data-key="${key}">Cambiar</button>
        </article>
      `).join('');
      preciosList.querySelectorAll('.precio-cambiar-btn').forEach((btn) => {
        btn.addEventListener('click', () => openPrecioModal(btn.getAttribute('data-key')));
      });
    }

    async function cargarPrecios(){
      preciosStatus.textContent = 'Cargando precios...';
      preciosStatus.classList.remove('error');
      try {
        const resp = await fetch('/admin/api/precios', { credentials: 'same-origin' });
        if(resp.status === 401){
          location.href = '/admin';
          return;
        }
        const data = await resp.json().catch(() => ({}));
        if(!resp.ok || data.ok === false || !data.precios){
          throw new Error(data.error || 'No se pudieron cargar los precios.');
        }
        precios = data.precios;
        preciosStatus.textContent = '';
        renderPrecios();
      } catch(err){
        console.error('Error cargando precios:', err);
        preciosStatus.textContent = 'No se pudieron cargar los precios. Recarga la página.';
        preciosStatus.classList.add('error');
      }
    }

    function openPrecioModal(key){
      const producto = PRODUCTOS.find((p) => p.key === key);
      if(!producto) return;
      editingKey = key;
      precioModalNombre.textContent = producto.nombre;
      precioModalInput.value = Number(precios[key] || 0).toFixed(2);
      precioModalError.textContent = '';
      precioModalBackdrop.classList.add('is-open');
      precioModalBackdrop.setAttribute('aria-hidden', 'false');
      precioModalInput.focus();
    }

    function closePrecioModal(){
      editingKey = null;
      precioModalError.textContent = '';
      precioModalBackdrop.classList.remove('is-open');
      precioModalBackdrop.setAttribute('aria-hidden', 'true');
      precioModalSave.disabled = false;
      precioModalCancel.disabled = false;
    }

    async function guardarPrecio(){
      if(!editingKey) return;
      const nuevoValor = Number(String(precioModalInput.value || '').replace(',', '.'));
      if(!Number.isFinite(nuevoValor) || nuevoValor < 0){
        precioModalError.textContent = 'Introduce un precio válido mayor o igual a 0.';
        return;
      }
      precioModalSave.disabled = true;
      precioModalCancel.disabled = true;
      precioModalError.textContent = '';
      try {
        const payload = { ...precios, [editingKey]: nuevoValor };
        const resp = await fetch('/admin/api/precios', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify(payload)
        });
        if(resp.status === 401){
          location.href = '/admin';
          return;
        }
        const data = await resp.json().catch(() => ({}));
        if(!resp.ok || data.ok === false || !data.precios){
          precioModalError.textContent = data.error || 'No se pudo guardar el precio.';
          return;
        }
        precios = data.precios;
        renderPrecios();
        closePrecioModal();
      } catch(_err){
        precioModalError.textContent = 'Error guardando el precio.';
      } finally {
        if(precioModalBackdrop.classList.contains('is-open')){
          precioModalSave.disabled = false;
          precioModalCancel.disabled = false;
        }
      }
    }

    precioModalCancel.addEventListener('click', closePrecioModal);
    precioModalSave.addEventListener('click', guardarPrecio);
    precioModalBackdrop.addEventListener('click', (ev) => {
      if(ev.target === precioModalBackdrop) closePrecioModal();
    });
    document.addEventListener('keydown', (ev) => {
      if(ev.key === 'Escape' && precioModalBackdrop.classList.contains('is-open')) closePrecioModal();
    });

    menuBtn.addEventListener('click', () => {
      location.href = '/admin';
    });

    cargarPrecios();
  </script>
</body>
</html>
