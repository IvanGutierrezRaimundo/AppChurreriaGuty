<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Menu</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .admin-menu-wrap{
      max-width: 1200px;
      margin: 0 auto;
    }
    .admin-menu-head{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: var(--space-lg);
    }
    .admin-menu-head h1{
      margin: 0;
      color: var(--color-brown);
    }
    .admin-menu-grid{
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }
    button.admin-tile{
      border: 1px solid var(--color-border);
      border-radius: 14px;
      background: #fff;
      color: var(--color-brown);
      min-height: 96px;
      text-align: center;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
    }
    button.admin-tile:hover{
      background: #fff;
      color: var(--color-brown);
      transform: translateY(-2px);
      border-color: var(--color-brown);
      box-shadow: var(--shadow-md);
    }
    .admin-tile-title{
      display: block;
      width: 100%;
      font-size: 1.02rem;
      font-weight: 800;
      color: inherit;
      margin: 0;
      line-height: 1.2;
      text-align: center;
    }
    @media (max-width: 960px){
      .admin-menu-grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px){
      .admin-menu-head{ flex-direction: column; align-items: flex-start; }
      .admin-menu-grid{ grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="admin-menu-wrap">
    <section class="doc">
      <div class="admin-menu-head">
        <h1>Panel de administracion</h1>
        <button type="button" id="logoutBtn" title="Salir">Salir</button>
      </div>

      <div class="admin-menu-grid" aria-label="Menu de administracion">
        <button class="admin-tile" type="button" data-name="Pedidos" data-target="/admin/pedidos">
          <p class="admin-tile-title">Pedidos</p>
        </button>
        <button class="admin-tile" type="button" data-name="Facturas">
          <p class="admin-tile-title">Facturas</p>
        </button>
        <button class="admin-tile" type="button" data-name="Clientes" data-target="/admin/clientes">
          <p class="admin-tile-title">Clientes</p>
        </button>
        <button class="admin-tile" type="button" data-name="Proveedores">
          <p class="admin-tile-title">Proveedores</p>
        </button>
        <button class="admin-tile" type="button" data-name="Herramienta para pedidos">
          <p class="admin-tile-title">Herramienta para pedidos</p>
        </button>
        <button class="admin-tile" type="button" data-name="Ventas">
          <p class="admin-tile-title">Ventas</p>
        </button>
        <button class="admin-tile" type="button" data-name="Libro gastos y compras">
          <p class="admin-tile-title">Libro gastos y compras</p>
        </button>
        <button class="admin-tile" type="button" data-name="Cambio de precios">
          <p class="admin-tile-title">Cambio de precios</p>
        </button>
      </div>
    </section>
  </div>

  <div id="actionAlertModal" class="confirm-modal-backdrop hidden" aria-hidden="true">
    <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="actionAlertTitle">
      <div class="confirm-head">
        <h2 id="actionAlertTitle" class="confirm-title">Aviso</h2>
      </div>
      <p id="actionAlertText" class="confirm-status"></p>
      <div class="confirm-actions">
        <button type="button" id="actionAlertAccept">Aceptar</button>
      </div>
    </div>
  </div>

  <script>
    const actionAlertModal = document.getElementById('actionAlertModal');
    const actionAlertTitle = document.getElementById('actionAlertTitle');
    const actionAlertText = document.getElementById('actionAlertText');
    const actionAlertAccept = document.getElementById('actionAlertAccept');
    let actionAlertResolver = null;

    function closeActionAlertModal(){
      actionAlertModal.classList.add('hidden');
      actionAlertModal.setAttribute('aria-hidden', 'true');
      actionAlertText.classList.remove('error');
      if(actionAlertResolver){
        const resolve = actionAlertResolver;
        actionAlertResolver = null;
        resolve(true);
      }
    }

    function showActionAlert({ title, message, acceptText, type }){
      const resolvedType = type || ((title || '').toLowerCase() === 'error' ? 'error' : 'info');
      actionAlertTitle.textContent = title || (resolvedType === 'error' ? 'Error' : 'Aviso');
      actionAlertText.textContent = message || '';
      actionAlertText.classList.toggle('error', resolvedType === 'error');
      actionAlertAccept.textContent = acceptText || 'Aceptar';
      actionAlertModal.classList.remove('hidden');
      actionAlertModal.setAttribute('aria-hidden', 'false');
      actionAlertAccept.focus();
      return new Promise((resolve) => {
        actionAlertResolver = resolve;
      });
    }

    document.querySelectorAll('.admin-tile').forEach((tile) => {
      tile.addEventListener('click', async () => {
        const target = tile.dataset.target;
        if (target) {
          location.href = target;
          return;
        }
        const sectionName = tile.dataset.name || 'Seccion';
        await showActionAlert({ title: 'Aviso', message: sectionName + ' aun no esta disponible.' });
      });
    });

    actionAlertAccept.addEventListener('click', closeActionAlertModal);
    actionAlertModal.addEventListener('click', (ev) => {
      if(ev.target === actionAlertModal){
        closeActionAlertModal();
      }
    });
    document.addEventListener('keydown', (ev) => {
      if(ev.key === 'Escape' && !actionAlertModal.classList.contains('hidden')){
        closeActionAlertModal();
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/admin/logout', { method: 'POST' });
      location.href = '/admin';
    });
  </script>
</body>
</html>
